# Test policies for memory safety enhancement validation
---
apiVersion: optipod.optipod.io/v1alpha1
kind: OptimizationPolicy
metadata:
  name: memory-safety-default-limits
  namespace: default
spec:
  mode: Auto
  reconciliationInterval: 30s

  selector:
    namespaces:
      allow:
        - default
    workloadTypes:
      include:
        - Deployment
    labels:
      test-type: memory-safety

  metricsConfig:
    provider: metrics-server
    rollingWindow: 2m
    percentile: P90
    safetyFactor: 1.1

  resourceBounds:
    cpu:
      min: "10m"
      max: "2000m"
    memory:
      min: "32Mi"
      max: "8Gi"

  updateStrategy:
    allowInPlaceResize: true
    allowRecreate: false
    updateRequestsOnly: false
    useServerSideApply: true
    # No limitConfig - should use default multipliers

---
apiVersion: optipod.optipod.io/v1alpha1
kind: OptimizationPolicy
metadata:
  name: memory-safety-custom-limits
  namespace: default
spec:
  mode: Auto
  reconciliationInterval: 30s

  selector:
    namespaces:
      allow:
        - default
    workloadTypes:
      include:
        - Deployment
    labels:
      test-type: memory-safety

  metricsConfig:
    provider: metrics-server
    rollingWindow: 2m
    percentile: P90
    safetyFactor: 1.1

  resourceBounds:
    cpu:
      min: "10m"
      max: "2000m"
    memory:
      min: "32Mi"
      max: "8Gi"

  updateStrategy:
    allowInPlaceResize: true
    allowRecreate: false
    updateRequestsOnly: false
    useServerSideApply: true
    limitConfig:
      cpuLimitMultiplier: 2.0
      memoryLimitMultiplier: 1.5

---
apiVersion: optipod.optipod.io/v1alpha1
kind: OptimizationPolicy
metadata:
  name: memory-safety-requests-only
  namespace: default
spec:
  mode: Auto
  reconciliationInterval: 30s

  selector:
    namespaces:
      allow:
        - default
    workloadTypes:
      include:
        - Deployment
    labels:
      test-type: memory-safety

  metricsConfig:
    provider: metrics-server
    rollingWindow: 2m
    percentile: P90
    safetyFactor: 1.1

  resourceBounds:
    cpu:
      min: "10m"
      max: "2000m"
    memory:
      min: "32Mi"
      max: "8Gi"

  updateStrategy:
    allowInPlaceResize: true
    allowRecreate: false
    updateRequestsOnly: true  # Only update requests, not limits
    useServerSideApply: true
