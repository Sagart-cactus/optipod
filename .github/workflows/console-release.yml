name: Console release artifacts
on:
  pull_request:
    paths: ['internal/console*/**', 'internal/consoletls/**', 'cmd/optipod-console/**', 'charts/optipod*/**', 'hack/console/**', 'Dockerfile.console', '.github/workflows/console-release.yml', 'go.mod', 'go.sum']
  push:
    tags: ['console-v*']
permissions:
  contents: read
concurrency:
  group: console-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Check release tag and supported protocol
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_REF" != refs/tags/console-v0.3.0 ]]; then exit 1; fi
          go test ./internal/consoleinstall ./internal/consoletls ./internal/consoleenroll
      - name: Build matching CLI binaries and charts
        run: bash hack/console/package.sh .dev/console/release
      - name: Verify native packaged installer
        run: |
          mkdir /tmp/console-release-test
          tar -xzf .dev/console/release/optipod-console_0.3.0_linux_amd64.tar.gz -C /tmp/console-release-test
          test "$(/tmp/console-release-test/optipod-console version)" = 0.3.0
          /tmp/console-release-test/optipod-console onboard --help
          (cd .dev/console/release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: console-release-bundle
          path: .dev/console/release/*
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/console-v')
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a reviewed main-branch commit
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v7
        with:
          name: console-release-bundle
          path: release
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sagart-cactus/optipod-console:0.3.0
          labels: org.opencontainers.image.source=https://github.com/Sagart-cactus/optipod
          build-args: VERSION=0.3.0
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sagart-cactus/optipod:console-0.3.0
          labels: org.opencontainers.image.source=https://github.com/Sagart-cactus/optipod
          cache-from: type=gha,scope=console-controller
          cache-to: type=gha,mode=max,scope=console-controller
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Publish versioned charts and downloadable installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push release/optipod-console-0.3.0.tgz oci://ghcr.io/sagart-cactus/charts
          helm push release/optipod-1.6.0-console.0.tgz oci://ghcr.io/sagart-cactus/charts
          gh release create console-v0.3.0 release/* --verify-tag --latest=false --title 'OptiPod Console 0.3.0' --notes-file docs/console-release-0.3.0.md
