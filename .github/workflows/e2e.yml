name: Kind E2E

# Hermetic installed-controller tiers (test/e2e/suite via test/e2e/framework).
# Each run owns one uniquely named Kind cluster with a private kubeconfig,
# builds/loads/installs the checkout controller once and removes only its own
# cluster. See docs/testing/design.md section 7 for the CI topology contract.
#
# Tiers:
#   - smoke: every pull request and push that touches controller, API, chart,
#     manifest, test, Make or workflow inputs. A test failure fails the job.
#   - conformance: nightly schedule and manual dispatch run the full
#     conformance suite (which includes the smoke coverage) over the same
#     harness.

on:
  pull_request:
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'charts/**'
      - 'config/**'
      - 'test/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/e2e.yml'
  push:
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'charts/**'
      - 'config/**'
      - 'test/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/e2e.yml'
  schedule:
    # Full conformance nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Bound CI resource use: one Kind run per ref at a time; superseded PR runs
# are cancelled instead of stacking clusters on a fresh runner.
concurrency:
  group: kind-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned harness inputs (must match test/e2e/framework/pins.go). The suite
  # preflight verifies the Kind CLI version and refuses to run otherwise.
  KIND_VERSION: v0.31.0
  KIND_SHA256_AMD64: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa # pragma: allowlist secret
  KUBECTL_VERSION: v1.34.1
  KUBECTL_SHA256_AMD64: 7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3 # pragma: allowlist secret
  KUSTOMIZE_VERSION: v5.8.1
  KUSTOMIZE_SHA256_AMD64: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d # pragma: allowlist secret

jobs:
  smoke:
    name: Kind smoke suite
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SUITE_TIMEOUT: 25m
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Kind, kubectl and kustomize
        run: |
          set -euo pipefail
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_AMD64}  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256_AMD64}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          curl -fsSLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256_AMD64}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize

          kind version
          kubectl version --client
          kustomize version

      - name: Verify Docker is running
        run: docker info --format '{{.ServerVersion}}'

      - name: Run Kind smoke suite
        run: make test-e2e-smoke

      - name: Upload JUnit, timing and redacted diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kind-smoke-artifacts
          path: |
            test/e2e/artifacts/**/junit.xml
            test/e2e/artifacts/**/timings.json
            test/e2e/artifacts/**/failures.txt
            test/e2e/artifacts/**/diagnostics/**
          retention-days: 14
          if-no-files-found: warn

  conformance:
    name: Kind conformance suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Kind, kubectl and kustomize
        run: |
          set -euo pipefail
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_AMD64}  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256_AMD64}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          curl -fsSLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256_AMD64}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize

          kind version
          kubectl version --client
          kustomize version

      - name: Verify Docker is running
        run: docker info --format '{{.ServerVersion}}'

      - name: Run Kind conformance suite
        run: make test-e2e-conformance

      - name: Upload JUnit, timing and redacted diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kind-conformance-artifacts
          path: |
            test/e2e/artifacts/**/junit.xml
            test/e2e/artifacts/**/timings.json
            test/e2e/artifacts/**/failures.txt
            test/e2e/artifacts/**/diagnostics/**
          retention-days: 14
          if-no-files-found: warn
