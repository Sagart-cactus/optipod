<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Test - OptiPod Landing Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .pass { color: green; }
        .fail { color: red; }
        .pending { color: orange; }
    </style>
</head>
<body>
    <h1>OptiPod Landing Page Integration Test</h1>
    <div class="test-section">
        <h2>Component Integration Tests</h2>
        <div id="test-results"></div>
    </div>

    <script>
        // Load the bundled JavaScript
        const script = document.createElement('script');
        script.src = 'dist/js/bundle.min.js';
        script.onload = runTests;
        document.head.appendChild(script);

        function runTests() {
            const results = document.getElementById('test-results');
            const tests = [
                {
                    name: 'Analytics Class Available',
                    test: () => typeof Analytics !== 'undefined'
                },
                {
                    name: 'GitHubStats Class Available',
                    test: () => typeof GitHubStats !== 'undefined'
                },
                {
                    name: 'FeaturesGrid Class Available',
                    test: () => typeof FeaturesGrid !== 'undefined'
                },
                {
                    name: 'ComparisonTable Class Available',
                    test: () => typeof ComparisonTable !== 'undefined'
                },
                {
                    name: 'CodeExamples Class Available',
                    test: () => typeof CodeExamples !== 'undefined'
                },
                {
                    name: 'Analytics Initialization',
                    test: () => {
                        try {
                            const analytics = new Analytics();
                            return analytics.getStatus && typeof analytics.getStatus === 'function';
                        } catch (e) {
                            return false;
                        }
                    }
                },
                {
                    name: 'GitHubStats Initialization',
                    test: () => {
                        try {
                            const githubStats = new GitHubStats('test', 'repo');
                            return githubStats.fetchStats && typeof githubStats.fetchStats === 'function';
                        } catch (e) {
                            return false;
                        }
                    }
                },
                {
                    name: 'FeaturesGrid Initialization',
                    test: () => {
                        try {
                            const featuresGrid = new FeaturesGrid();
                            return featuresGrid.init && typeof featuresGrid.init === 'function';
                        } catch (e) {
                            return false;
                        }
                    }
                },
                {
                    name: 'ComparisonTable Initialization',
                    test: () => {
                        try {
                            const comparisonTable = new ComparisonTable();
                            return comparisonTable.init && typeof comparisonTable.init === 'function';
                        } catch (e) {
                            return false;
                        }
                    }
                },
                {
                    name: 'CodeExamples Initialization',
                    test: () => {
                        try {
                            const codeExamples = new CodeExamples();
                            return codeExamples.examples && typeof codeExamples.examples === 'object';
                        } catch (e) {
                            return false;
                        }
                    }
                }
            ];

            let passed = 0;
            let total = tests.length;

            tests.forEach(test => {
                const result = test.test();
                const status = result ? 'pass' : 'fail';
                if (result) passed++;

                const div = document.createElement('div');
                div.innerHTML = `<span class="${status}">${status.toUpperCase()}</span> - ${test.name}`;
                results.appendChild(div);
            });

            const summary = document.createElement('div');
            summary.innerHTML = `<h3>Summary: ${passed}/${total} tests passed</h3>`;
            summary.style.marginTop = '20px';
            results.appendChild(summary);

            // Test user journey simulation
            setTimeout(() => {
                testUserJourney();
            }, 1000);
        }

        function testUserJourney() {
            const results = document.getElementById('test-results');
            const journeyDiv = document.createElement('div');
            journeyDiv.innerHTML = '<h3>User Journey Simulation</h3>';
            results.appendChild(journeyDiv);

            // Simulate analytics tracking
            if (typeof Analytics !== 'undefined') {
                try {
                    const analytics = new Analytics();
                    analytics.enableDebugMode();

                    // Simulate CTA click
                    analytics.trackEvent('test_cta_click', {
                        button_text: 'Test Button',
                        event_category: 'test'
                    });

                    journeyDiv.innerHTML += '<div class="pass">PASS - Analytics event tracking</div>';
                } catch (e) {
                    journeyDiv.innerHTML += '<div class="fail">FAIL - Analytics event tracking: ' + e.message + '</div>';
                }
            }

            // Test GitHub stats functionality
            if (typeof GitHubStats !== 'undefined') {
                try {
                    const githubStats = new GitHubStats('test', 'repo');
                    // Test fallback data
                    githubStats.fetchStats().then(stats => {
                        if (stats && stats.stars !== undefined) {
                            journeyDiv.innerHTML += '<div class="pass">PASS - GitHub stats with fallback data</div>';
                        } else {
                            journeyDiv.innerHTML += '<div class="fail">FAIL - GitHub stats data structure</div>';
                        }
                    }).catch(e => {
                        journeyDiv.innerHTML += '<div class="fail">FAIL - GitHub stats fetch: ' + e.message + '</div>';
                    });
                } catch (e) {
                    journeyDiv.innerHTML += '<div class="fail">FAIL - GitHub stats initialization: ' + e.message + '</div>';
                }
            }

            journeyDiv.innerHTML += '<div class="pass">PASS - User journey simulation completed</div>';
        }
    </script>
</body>
</html>
