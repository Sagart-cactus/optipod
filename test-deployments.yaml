apiVersion: apps/v1
kind: Deployment
metadata:
  name: underutilized
spec:
  replicas: 1
  selector:
    matchLabels:
      app: underutilized
  template:
    metadata:
      labels:
        app: underutilized
    spec:
      containers:
      - name: idle
        image: registry.k8s.io/pause:3.10.1
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-overutilized
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress-overutilized
  template:
    metadata:
      labels:
        app: stress-overutilized
    spec:
      containers:
      - name: stress
        image: polinux/stress-ng
        args:
        - "--cpu"
        - "1"
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "800M"
        - "--timeout"
        - "0"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
