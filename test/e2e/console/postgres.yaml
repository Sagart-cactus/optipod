apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: optipod-console-e2e
spec:
  selector: {app: console-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: optipod-console-e2e
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: console-postgres}
  template:
    metadata:
      labels: {app: console-postgres}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.7
          env:
            - {name: POSTGRES_DB, value: optipod}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: database, key: password}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, optipod]}
            initialDelaySeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
