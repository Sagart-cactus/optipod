# Local test backend. Source image: https://github.com/prometheus/prometheus/releases/tag/v3.16.0
apiVersion: v1
kind: Namespace
metadata:
  name: optipod-e2e-backends
  labels: {app.kubernetes.io/managed-by: optipod-e2e-harness}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: optipod-e2e-backends
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: optipod-e2e-prometheus}
rules:
- apiGroups: [""]
  resources: [nodes, nodes/proxy, pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: optipod-e2e-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: optipod-e2e-prometheus}
subjects:
- {kind: ServiceAccount, name: prometheus, namespace: optipod-e2e-backends}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: optipod-e2e-backends}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
    - job_name: application-gauges
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_optipod_e2e_app_metrics]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: metrics
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
    - job_name: cadvisor
      scheme: https
      kubernetes_sd_configs:
      - role: node
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: optipod-e2e-backends}
spec:
  replicas: 1
  selector: {matchLabels: {app: e2e-prometheus}}
  template:
    metadata: {labels: {app: e2e-prometheus}}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      containers:
      - name: prometheus
        image: docker.io/prom/prometheus:v3.16.0
        args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d]
        ports: [{containerPort: 9090}]
        readinessProbe: {httpGet: {path: /-/ready, port: 9090}, periodSeconds: 2}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus}
        - {name: data, mountPath: /prometheus}
      volumes:
      - {name: config, configMap: {name: prometheus}}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: optipod-e2e-backends}
spec:
  selector: {app: e2e-prometheus}
  ports: [{port: 9090, targetPort: 9090}]
