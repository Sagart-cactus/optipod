# Effective QA profile settings. Bounds below are illustrative; review
# selectors and resource bounds for each DPV2 workload before Auto.
scalingPolicyName: qa-stability-1
vertical:
  optimization: "on"
  applyType: immediate
  startup: {period: 2m}
  confidence: {threshold: 0.9, required: true}
  cpu:
    target: p99
    lookBackPeriod: 168h
    overhead: 0.10
    min: 50m
    max: "4"
    limit: {type: noLimit}
  memory:
    target: max
    lookBackPeriod: 168h
    overhead: 0.10
    min: 64Mi
    max: 8Gi
    limit: {type: automatic}
