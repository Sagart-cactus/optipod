{{- $name := printf "%s-postgresql" .Release.Name }}
{{- $secret := .Values.auth.existingSecret }}
{{- if .Values.auth.create }}
{{- $password := trim .Values.auth.password }}
{{- if or $secret (lt (len $password) 32) (regexMatch "[[:space:]]" $password) }}
{{- fail "postgresql auth requires one credential source and a password of at least 32 characters" }}
{{- end }}
{{- $secret = $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
---
{{- else }}
{{- $secret = required "postgresql.auth.existingSecret is required unless auth.create=true" $secret }} # pragma: allowlist secret - templated value, no literal credential
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: POSTGRES_DB, value: optipod}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: password}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, optipod]}
            initialDelaySeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.persistence.size }}}
