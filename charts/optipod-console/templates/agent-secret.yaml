{{- $secret := .Values.agent.secret | default dict }}
{{- if and .Values.agent.enabled $secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "optipod-console.agentSecretName" . | quote }}
  labels:
    app.kubernetes.io/name: optipod-console
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
type: Opaque
data:
  token: {{ include "optipod-console.agentToken" . | b64enc | quote }}
{{- end }}
