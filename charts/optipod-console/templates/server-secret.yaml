{{- if and .Values.server.enabled .Values.server.secret.create }}
{{- if .Values.server.existingSecret }}
{{- fail "choose either server.existingSecret or server.secret.create" }}
{{- end }}
{{- $config := deepCopy .Values.server.secret.config }}
{{- $_ := required "server.secret.config.publicURL is required" $config.publicURL }}
{{- if .Values.server.agentTLS.enabled }}
{{- $_ := set $config "agentTLS" (dict "listen" ":8443" "publicURL" (required "server.agentTLS.publicURL is required" .Values.server.agentTLS.publicURL) "serverCertificateFile" "/etc/agent-tls/server.crt" "serverKeyFile" "/etc/agent-tls/server.key" "clientCAFile" "/etc/agent-tls/client-ca.crt" "clientCAKeyFile" "/etc/agent-tls/client-ca.key" "serverCAFile" "/etc/agent-tls/server-ca.crt") }}
{{- end }}
{{- $databaseURL := .Values.server.secret.databaseURL }}
{{- if and (not $databaseURL) .Values.postgresql.enabled .Values.postgresql.auth.create }}
{{- $databaseURL = printf "postgresql://postgres:%s@%s-postgresql:5432/optipod?sslmode=disable" (.Values.postgresql.auth.password | trim | urlquery) .Release.Name }} # pragma: allowlist secret - templated value, no literal credential
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-server-config
type: Opaque
data:
  config.json: {{ $config | toJson | b64enc | quote }}
  database-url: {{ required "server.secret.databaseURL is required for an external database or external database credentials" $databaseURL | b64enc | quote }}
{{- end }}
{{- if and .Values.server.enabled .Values.server.agentTLS.enabled .Values.server.agentTLS.secret.create }}
{{- if .Values.server.agentTLS.existingSecret }}
{{- fail "choose either server.agentTLS.existingSecret or server.agentTLS.secret.create" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-agent-tls
type: Opaque
data:
  {{- range $key := list "server.crt" "server.key" "client-ca.crt" "client-ca.key" "server-ca.crt" }}
  {{ $key }}: {{ required (printf "agent TLS key %s is required" $key) (index $.Values.server.agentTLS.secret.data $key) | b64enc | quote }}
  {{- end }}
{{- end }}
