apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "optipod.fullname" . }}-controller
  namespace: {{ include "optipod.namespace" . }}
  labels:
    {{- include "optipod.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  {{- with .Values.controller.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "optipod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "optipod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      {{- if .Values.controller.priorityClassName }}
      priorityClassName: {{ .Values.controller.priorityClassName }}
      {{- end }}
      {{- if .Values.controller.dnsPolicy }}
      dnsPolicy: {{ .Values.controller.dnsPolicy }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "optipod.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: manager
        image: {{ include "optipod.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --enable-webhook=false
        {{- if .Values.controller.enableHTTP2 }}
        - --enable-http2=true
        {{- end }}
        {{- if .Values.metrics.secure }}
        - --metrics-secure=true
        {{- end }}
        {{- if .Values.metrics.tls.certPath }}
        - --metrics-cert-path={{ .Values.metrics.tls.certPath }}
        {{- end }}
        {{- if .Values.metricsProvider }}
        {{- if eq .Values.metricsProvider.type "prometheus" }}
        {{- if .Values.metricsProvider.prometheus.auth.type }}
        - --prometheus-auth-type={{ .Values.metricsProvider.prometheus.auth.type }}
        {{- end }}
        {{- if .Values.metricsProvider.prometheus.tls.insecureSkipVerify }}
        - --prometheus-tls-insecure-skip-verify=true
        {{- end }}
        {{- if .Values.metricsProvider.prometheus.tls.existingSecret.name }}
        - --prometheus-tls-ca-file=/etc/prometheus/tls/{{ .Values.metricsProvider.prometheus.tls.existingSecret.caKey }}
        {{- if .Values.metricsProvider.prometheus.tls.existingSecret.certKey }}
        - --prometheus-tls-cert-file=/etc/prometheus/tls/{{ .Values.metricsProvider.prometheus.tls.existingSecret.certKey }}
        - --prometheus-tls-key-file=/etc/prometheus/tls/{{ .Values.metricsProvider.prometheus.tls.existingSecret.keyKey }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.logging.level }}
        - --zap-log-level={{ .Values.logging.level }}
        {{- end }}
        {{- if eq .Values.logging.format "json" }}
        - --zap-encoder=json
        {{- end }}
        ports:
        - name: metrics
          containerPort: {{ .Values.controller.ports.metrics }}
          protocol: TCP
        - name: health
          containerPort: {{ .Values.controller.ports.health }}
          protocol: TCP
        livenessProbe:
          {{- toYaml .Values.controller.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.controller.readinessProbe | nindent 10 }}
        securityContext:
          {{- toYaml .Values.controller.securityContext | nindent 10 }}
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/optipod
          readOnly: true
        {{- if and .Values.metricsProvider (eq .Values.metricsProvider.type "prometheus") }}
        {{- if .Values.metricsProvider.prometheus.tls.existingSecret.name }}
        - name: prometheus-tls
          mountPath: /etc/prometheus/tls
          readOnly: true
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.controller.envConfigMap.enabled .Values.controller.envConfigMap.name }}
        envFrom:
        - configMapRef:
            name: {{ .Values.controller.envConfigMap.name }}
            optional: {{ .Values.controller.envConfigMap.optional }}
          {{- if .Values.controller.envConfigMap.prefix }}
          prefix: {{ .Values.controller.envConfigMap.prefix | quote }}
          {{- end }}
        {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- if and .Values.metricsProvider (eq .Values.metricsProvider.type "prometheus") }}
        {{- if eq .Values.metricsProvider.prometheus.auth.type "basic" }}
        {{- if .Values.metricsProvider.prometheus.auth.basic.existingSecret.name }}
        - name: PROMETHEUS_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.metricsProvider.prometheus.auth.basic.existingSecret.name }}
              key: {{ .Values.metricsProvider.prometheus.auth.basic.existingSecret.usernameKey }}
        - name: PROMETHEUS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.metricsProvider.prometheus.auth.basic.existingSecret.name }}
              key: {{ .Values.metricsProvider.prometheus.auth.basic.existingSecret.passwordKey }}
        {{- else if .Values.metricsProvider.prometheus.auth.basic.username }}
        - name: PROMETHEUS_USERNAME
          value: {{ .Values.metricsProvider.prometheus.auth.basic.username | quote }}
        - name: PROMETHEUS_PASSWORD
          value: {{ .Values.metricsProvider.prometheus.auth.basic.password | quote }}
        {{- end }}
        {{- else if eq .Values.metricsProvider.prometheus.auth.type "bearer" }}
        {{- if .Values.metricsProvider.prometheus.auth.bearer.existingSecret.name }}
        - name: PROMETHEUS_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.metricsProvider.prometheus.auth.bearer.existingSecret.name }}
              key: {{ .Values.metricsProvider.prometheus.auth.bearer.existingSecret.key }}
        {{- else if .Values.metricsProvider.prometheus.auth.bearer.token }}
        - name: PROMETHEUS_BEARER_TOKEN
          value: {{ .Values.metricsProvider.prometheus.auth.bearer.token | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: optipod-config
          optional: true
      {{- if and .Values.metricsProvider (eq .Values.metricsProvider.type "prometheus") }}
      {{- if .Values.metricsProvider.prometheus.tls.existingSecret.name }}
      - name: prometheus-tls
        secret:
          secretName: {{ .Values.metricsProvider.prometheus.tls.existingSecret.name }}
      {{- end }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
