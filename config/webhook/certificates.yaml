# Certificate management for webhook TLS
# This file contains the manual certificate secret template for use when cert-manager is not available.
# For cert-manager-based certificate management, see config/webhook-enabled/issuer.yaml and certificate.yaml

# Manual certificate secret template
# Use this when cert-manager is not available (e.g., in kind clusters)
# The install script will generate and populate this secret automatically in manual mode
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-certs
  namespace: system
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # These fields are populated automatically by the install script when using manual certificate mode
  # To generate manually:
  # openssl req -x509 -newkey rsa:2048 -keyout tls.key -out tls.crt -days 365 -nodes \
  #   -subj "/CN=optipod-webhook-service.system.svc" \
  #   -addext "subjectAltName=DNS:optipod-webhook-service.system.svc,DNS:optipod-webhook-service.system.svc.cluster.local"
  # Then: base64 -w 0 tls.crt > tls.crt.b64 && base64 -w 0 tls.key > tls.key.b64
  tls.crt: ""  # Populated by install script or manually
  tls.key: ""  # Populated by install script or manually
