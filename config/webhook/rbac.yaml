---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-server
  namespace: system
  labels:
    app.kubernetes.io/name: optipod-webhook
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-server-role
  labels:
    app.kubernetes.io/name: optipod-webhook
    app.kubernetes.io/managed-by: kustomize
rules:
# Core webhook permissions
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Access to OptimizationPolicies for policy matching
- apiGroups: ["optipod.optipod.io"]
  resources: ["optimizationpolicies"]
  verbs: ["get", "list", "watch"]
# Access to workloads for annotation management
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "patch", "update"]
# Webhook configuration management
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingadmissionwebhooks"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Certificate and secret access
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
  resourceNames: ["webhook-server-certs", "webhook-server-certs-manual"]
# Metrics access (if needed)
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-server-rolebinding
  labels:
    app.kubernetes.io/name: optipod-webhook
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webhook-server-role
subjects:
- kind: ServiceAccount
  name: webhook-server
  namespace: system
---
# Leader election role for webhook high availability
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-leader-election-role
  namespace: system
  labels:
    app.kubernetes.io/name: optipod-webhook
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-leader-election-rolebinding
  namespace: system
  labels:
    app.kubernetes.io/name: optipod-webhook
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webhook-leader-election-role
subjects:
- kind: ServiceAccount
  name: webhook-server
  namespace: system
