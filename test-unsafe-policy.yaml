apiVersion: optipod.optipod.io/v1alpha1
kind: OptimizationPolicy
metadata:
  name: test-unsafe-policy
  namespace: default
spec:
  mode: Auto
  reconciliationInterval: 1m
  selector:
    namespaces:
      allow:
        - default
    workloadTypes:
      include:
        - Deployment
  metricsConfig:
    provider: metrics-server
    percentile: P90
    rollingWindow: 5m
    safetyFactor: 1.2
  resourceBounds:
    cpu:
      min: 10m
      max: 4000m
    memory:
      min: 32Mi
      max: 8Gi
  updateStrategy:
    allowInPlaceResize: true
    allowRecreate: false
    updateRequestsOnly: false
    useServerSideApply: true
    allowUnsafeMemoryDecrease: true  # This should allow auto-application
    limitConfig:
      cpuLimitMultiplier: 1.5
      memoryLimitMultiplier: 1.3
