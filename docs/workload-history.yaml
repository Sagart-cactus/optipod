scope: Decision, settings and applied-change history for OptiPod workload optimization
implemented:
  storage: Namespaced Kubernetes ConfigMaps in each workload namespace
  action_journal:
    content: Exact controlled-resource plan, original template and live pod resources, workload/policy UIDs and generations, configured/effective policy specs, timestamps, result and rollback status
    durability: Immutable snapshot is persisted before resource mutation; completion status is recorded in metadata
    retention: Latest 32 records and 30 days on subsequent writes, with latest and prepared/pending rollback records always protected
  decision_journal:
    content: Outcome, reason, recommendation values, complete observed policy spec, policy/workload identity and applied-record link
    outcomes: Recommended, Applied, Skipped and Error, including disabled policies and missing metrics
    deduplication: A record is written when the decision or observed policy revision changes; identical reconciles and freshness-only renewals are not duplicated
    isolation: Separate index and 64-record/30-day retention; decisions never replace the guarded rollback target
  node_admission_journal:
    content: Destination node, original resources, admitted plan, pod identity and the policy spec used at admission
    durability: Admission receipt is attached to the pod and copied by the controller to an immutable journal
    retention: Latest 128 records and 30 days on subsequent writes
    limitation: A pod deleted before the controller observes its receipt may leave no durable journal; these are not uniform rollback targets
  survival: Controller restart and workload deletion preserve local journals; namespace or cluster deletion removes local journals. The optional PostgreSQL console preserves already exported observations.
  shared_persistence: See docs/persistent-console.yaml for implemented PostgreSQL storage, durable agent queues and authenticated multi-cluster UI.
  limits:
    - Snapshots are capped at 512KiB; admission receipts at 64KiB. These bounds avoid Kubernetes metadata/ConfigMap size limits.
    - Retention runs on subsequent writes, not a global timer. Deleted/inactive workloads can retain records beyond 30 days.
    - Per-workload limits do not bound total cluster storage; size etcd/API-server load against fleet size and change frequency before broad rollout.
    - Settings are the policy revisions actually observed for a workload, not a complete audit of every intermediate edit.
    - Phase and error metadata can change during an action. Immutable ConfigMap data is not a tamper-proof external audit log.
    - Historical records created before policy-spec snapshots were added may omit those fields.
    - A Webhook application record means a future-admission plan was published. It does not prove every later pod was mutated; inspect actual pod resources. The shipped fail-open webhook admits original resources when unavailable.
    - Native HPA replica decisions and direct changes by other controllers are outside the resource journal; use HPA events and Kubernetes audit logs.
    - Raw metric series remain in the selected metrics backend; decision history is not a metrics database.
read:
  cli: bin/optipodctl history --kubeconfig PRIVATE_FILE --namespace TARGET --workload-uid UID
  ui: bin/optipodctl serve --kubeconfig PRIVATE_FILE --namespace TARGET --port 8765
  all_namespaced_records: kubectl --kubeconfig PRIVATE_FILE -n TARGET get configmaps -l optipod.io/history=true -o json
  rollback: See docs/workload-migration.yaml; rollback requires the latest bound eligible action and live safety checks
recommended_production_storage:
  desired_settings: Git-managed OptimizationPolicy manifests; PR history records intent and reviewer/author identity
  recent_operational_history: The implemented ConfigMap journal, with scoped Kubernetes RBAC
  shared_queryable_history:
    storage: PostgreSQL through the optional console agent and shared API
    status: Implemented; deployment, retention, backup and polling limitations are documented in docs/persistent-console.yaml
  optional_cold_archive:
    service: GCS in your existing GCP environment
    status: Future option; the implemented exporter targets PostgreSQL, not object storage
    format: Versioned JSON records with cluster identity, namespace, workload UID, record name and phase/update timestamp
    export_behavior: Watch/list with resource-version recovery; checkpoint only after successful write; retry idempotently and archive phase transitions as new objects
    retention: Choose a retention period for operational requirements; bucket lifecycle can expire old archives
    query_option: Add BigQuery indexing later if cross-cluster timeline queries justify it
    caution: Bucket retention locking is irreversible; it is not required for an initial archive
  actor_attribution: Git history for declared settings plus Kubernetes audit logs for direct API edits
sources:
  - https://kubernetes.io/docs/concepts/configuration/configmap/
  - https://docs.cloud.google.com/storage/docs/using-bucket-lock
