# Test workloads for memory safety enhancement validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-safety-underutilized
  namespace: default
  labels:
    test-type: memory-safety
    workload-type: underutilized
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-safety-underutilized
  template:
    metadata:
      labels:
        app: memory-safety-underutilized
    spec:
      containers:
      - name: idle
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "1"
            memory: "4Gi"
          limits:
            cpu: "1"
            memory: "4Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-safety-overutilized
  namespace: default
  labels:
    test-type: memory-safety
    workload-type: overutilized
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-safety-overutilized
  template:
    metadata:
      labels:
        app: memory-safety-overutilized
    spec:
      containers:
      - name: stress
        image: polinux/stress-ng
        args:
        - "--cpu"
        - "1"
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "900M"
        - "--timeout"
        - "0"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-safety-moderate
  namespace: default
  labels:
    test-type: memory-safety
    workload-type: moderate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-safety-moderate
  template:
    metadata:
      labels:
        app: memory-safety-moderate
    spec:
      containers:
      - name: moderate-load
        image: polinux/stress-ng
        args:
        - "--cpu"
        - "0.5"
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "200M"
        - "--timeout"
        - "0"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
